name: Contract bindings pipeline

# Keeps packages/bindings/* (and, transitively, @globe-wallet/sdk) in sync
# with the globe-wallet contract's actual interface. Builds the contract to
# wasm, regenerates its TypeScript bindings straight from that wasm's spec,
# and fails if the regenerated output differs from what's committed — so a
# contract interface change can never silently leave the SDK stale.
#
# Runs from the wasm it builds (not the deployed testnet contract), so it
# catches an interface change in the same PR that makes it, before anything
# is deployed.

on:
  push:
    paths:
      - "contract/contracts/globe-wallet/**"
      - "contract/Cargo.toml"
      - "packages/bindings/**"
      - ".github/workflows/contract-bindings.yml"
  pull_request:
    paths:
      - "contract/contracts/globe-wallet/**"
      - "contract/Cargo.toml"
      - "packages/bindings/**"
      - ".github/workflows/contract-bindings.yml"

permissions:
  contents: read

jobs:
  bindings-and-sdk:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build globe-wallet contract wasm
        working-directory: contract
        run: cargo build --target wasm32-unknown-unknown --release -p globe-wallet

      - name: Install Stellar CLI
        run: cargo install --locked stellar-cli --version 27.0.0

      - name: Regenerate globe-wallet bindings from the built wasm
        run: |
          stellar contract bindings typescript \
            --wasm contract/target/wasm32-unknown-unknown/release/globe_wallet.wasm \
            --output-dir packages/bindings/globe-wallet \
            --overwrite

      - name: Fail if regenerated bindings differ from what's committed
        run: |
          git diff --exit-code -- packages/bindings/globe-wallet/src || {
            echo "::error::packages/bindings/globe-wallet/src is stale. The contract's interface changed — run the 'Regenerate globe-wallet bindings' step locally and commit the result."
            exit 1
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install workspace dependencies
        run: npm install

      - name: Type-check SDK against the (possibly regenerated) bindings
        run: npm run type-check --workspace=@globe-wallet/sdk

name: E2E Testnet Nightly

# Runs the real-network e2e suite (#123) against Stellar testnet: build a
# transaction, sign it locally, submit it (payment + path payment), plus a
# read and a rejection check against the live globe-wallet contract. This
# is deliberately separate from backend.yml's `npm test`, which never
# touches the network.

on:
  schedule:
    # 03:00 UTC daily.
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  e2e-testnet:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Testnet is occasionally flaky; the suite already retries Friendbot
    # funding/account loads itself, so a job-level retry would only mask a
    # real regression. One attempt, clearly reported.
    continue-on-error: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run testnet e2e suite
        run: npm run test:e2e -- --verbose
        env:
          E2E_TESTNET: "1"

      - name: Report failure
        if: failure()
        run: |
          echo "::error::Testnet e2e suite failed — see the 'Run testnet e2e suite' step above for which of build/sign/submit payment, path payment, or the contract call broke. This talks to real testnet infrastructure (Horizon, Soroban RPC, Friendbot), so also rule out a testnet outage before treating this as a code regression."
